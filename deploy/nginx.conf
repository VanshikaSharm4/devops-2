worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Sticky sessions — same user always hits same Streamlit worker
    # This is CRITICAL for Streamlit: session state is in-process
    upstream streamlit_backend {
        ip_hash;                    # sticky by client IP
        server 127.0.0.1:8501;     # worker 1
        server 127.0.0.1:8502;     # worker 2
        server 127.0.0.1:8503;     # worker 3
    }

    server {
        listen 80;
        server_name _;

        # Increase timeouts for LLM calls (can take 60-90s)
        proxy_read_timeout     180s;
        proxy_connect_timeout  30s;
        proxy_send_timeout     180s;

        # WebSocket support (Streamlit requires this)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location / {
            proxy_pass http://streamlit_backend;
        }

        # Health check endpoint
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
